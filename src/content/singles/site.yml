footer_blurb: Since 1982, women have relied on our expertise to guide them through the uncertainty of unintended pregnancies. Through our free of charge services, we empower women to make fully informed choices about their pregnancy.
footer_button_label: Make A Donation
disclaimer: Atlanta Care Center does not offer annual exams, birth control, abortion services or referrals, prenatal and postnatal care, infertility treatments, or treatment for reproductive tract infections. Atlanta Care Center will offer referrals to local physicians for prenatal care. Medical services are provided in accordance with all applicable laws, and in accordance with pertinent medical standards, under the supervision and direction of a licensed physician. Patient information is held in strict and absolute confidence in accordance with our [Notice of Privacy Policy](/docs/privacy-policy.pdf). Releases and permissions are obtained appropriately. Patient information is only disclosed as required by law and when necessary to protect the patient or others against imminent harm.
